# Minimal one-shot composition: ChatGPT Web LLM + the default agent spine.
# No DeepSeek key, no credentials service, no persistence — one task, stdout.
- id: llm-chatgpt-web
  name: '/Users/twilight/Coding/Vibe/GWeb2dsh/dsh-llm-chatgpt-web/src/index.ts'
  config:
    headed: true
    turnTimeoutMs: 300000
    stallTimeoutMs: 120000

# Managed child-process groups for the bash executor.
- id: subprocess
  name: '/Users/twilight/deepseek-harness/packages/subprocess/subprocess-local/src/index.ts'

- id: bash
  name: '/Users/twilight/deepseek-harness/packages/shell/bash-local/src/index.ts'
  config:
    timeoutMs: 60000

# Local filesystem backend + model-facing file tools.
- id: fs-local
  name: '/Users/twilight/deepseek-harness/packages/fs/fs-local/src/index.ts'
  config:
    cwd: /tmp/dsh-chatgpt-task

- id: fs-observation-policy
  name: '/Users/twilight/deepseek-harness/packages/fs/fs-observation-policy/src/index.ts'

- id: tool-fs
  name: '/Users/twilight/deepseek-harness/packages/fs/tool-fs/src/index.ts'

- id: agent-spine
  name: '/Users/twilight/deepseek-harness/packages/examples/agent-spine-demo/src/index.ts'
  config:
    agents:
      - id: main
        provider: chatgpt-web
        model: chatgpt-web/light
        cwd: /tmp/dsh-chatgpt-task
    skills:
      enabled: false
    toolJobs: false
    persona: |
      You are a helpful assistant answering through ChatGPT Web.
      To execute anything, use the provided tools. Keep answers brief and factual.
    workspaceContext:
      maxBytes: 16384
