# dsh-llm-chatgpt-web bundle layer.
# One plugin row: registers the `chatgpt-web` provider route. All fields are
# optional — schema defaults apply. Text tools are the default; native MCP is
# an explicit Unix-only opt-in (see README).
#
# `name` must be the FULL package specifier as installed in the profile's
# node_modules. Quote the value: a YAML scalar starting with `@` would parse
# as a directive (unscoped names need no quotes, kept plain deliberately).
- insert:
    - id: llm-chatgpt-web
      name: dsh-llm-chatgpt-web
      config:
        headed: true
        # connectorTransport: mcp
        # connectorName: DSH Native
        # brokerSocketPath: ~/.dsh-chatgpt-web/native-broker.sock
        # mcpInvocationTimeoutMs: 90000
